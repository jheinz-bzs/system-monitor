# Release pipeline for BZS253-71 (self-update). A pushed semver tag (v1.2.3)
# fans out one native build per OS, then a collector job computes checksums and
# publishes a single GitHub Release. The app's internal/update downloader pulls
# these assets — so the asset names here are a contract with update.assetName().
#
# Native runners, NOT cross-compilation: Fyne needs CGO + a per-OS C toolchain
# (and OpenGL/X11 headers on Linux), which is painful to cross-compile. Each
# runner builds its own platform, so no cross toolchain is needed.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1 # Fyne requires cgo
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: system-monitor-linux-amd64
            ldflags: ""
            setup: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
          - os: windows-latest
            asset: system-monitor-windows-amd64.exe
            ldflags: "-H windowsgui" # no console window
            setup: ""
          - os: macos-latest # Apple Silicon runner -> darwin-arm64
            asset: system-monitor-darwin-arm64
            ldflags: ""
            setup: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install linux gui deps
        if: matrix.setup != ''
        run: ${{ matrix.setup }}
      # genassets directly (not `make generate`) so CI needs no GNU make on PATH.
      - name: generate bundled assets
        run: go run ./tools/genassets
      - name: build
        shell: bash
        run: |
          go build -ldflags "${{ matrix.ldflags }} -X main.version=${GITHUB_REF_NAME}" \
            -o "${{ matrix.asset }}" ./cmd/system-monitor
      # Linux ships three artifacts from the one binary: the bare binary (manual /
      # server use), an AppImage (the self-update target — a single file that swaps
      # like a binary), and a .deb (apt-managed, install-only). Naming must match
      # update.assetName(): the AppImage is system-monitor-linux-amd64.AppImage.
      - name: package linux (.deb + AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version_nov="${GITHUB_REF_NAME#v}" # Debian versions can't start with "v"

          # Brand diamond → PNG for the desktop entry / AppImage / .deb icon.
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 256 -h 256 internal/ui/icons/diamond.svg -o system-monitor.png

          # .deb via nfpm. GOTOOLCHAIN=auto for just this install: nfpm@latest may
          # need a newer Go than our pinned 1.26.3, and setup-go pins GOTOOLCHAIN=local
          # (which would error instead of fetching it). The app binary was already
          # built in the previous step on 1.26.3, so this doesn't touch our build.
          GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          VERSION="$version_nov" "$(go env GOPATH)/bin/nfpm" package \
            --config packaging/nfpm.yaml --packager deb --target .

          # AppImage via linuxdeploy (bundles the GL/X11 libs the binary links).
          mkdir -p AppDir/usr/bin
          cp "${{ matrix.asset }}" AppDir/usr/bin/system-monitor
          curl -sSfL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSfL -o linuxdeploy-plugin-appimage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export PATH="$PWD:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1 # CI runners have no FUSE
          export OUTPUT="system-monitor-linux-amd64.AppImage"
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/system-monitor \
            --desktop-file packaging/system-monitor.desktop \
            --icon-file system-monitor.png \
            --output appimage
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: |
            system-monitor-*
            *.deb

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true # flatten all per-OS artifacts into dist/
      # Checksums computed once here, over every asset, so the build jobs don't
      # each need a cross-platform sha256 tool (macOS lacks sha256sum).
      # Glob covers both hyphen-named assets (binaries, AppImage) and the
      # underscore-named .deb (system-monitor_<ver>_amd64.deb).
      - name: checksums
        run: |
          cd dist
          sha256sum system-monitor* > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/system-monitor*
            dist/checksums.txt
