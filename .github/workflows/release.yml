# Release pipeline for BZS253-71 (self-update). A pushed semver tag (v1.2.3)
# fans out one native build per OS, then a collector job computes checksums and
# publishes a single GitHub Release. The app's internal/update downloader pulls
# these assets — so the asset names here are a contract with update.assetName().
# After the release publishes, sync-homebrew-tap pushes the Homebrew cask
# (issue #67) into josephheinz/homebrew-tap for `brew install --cask
# system-monitor`.
#
# Native runners, NOT cross-compilation: Fyne needs CGO + a per-OS C toolchain
# (and OpenGL/X11 headers on Linux), which is painful to cross-compile. Each
# runner builds its own platform, so no cross toolchain is needed.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1 # Fyne requires cgo
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: system-monitor-linux-amd64
            ldflags: ""
            setup: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
          - os: windows-latest
            asset: system-monitor-windows-amd64.exe
            ldflags: "-H windowsgui" # no console window
            setup: ""
          - os: macos-latest # Apple Silicon runner -> darwin-arm64
            asset: system-monitor-darwin-arm64
            ldflags: ""
            setup: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install linux gui deps
        if: matrix.setup != ''
        run: ${{ matrix.setup }}
      # genassets directly (not `make generate`) so CI needs no GNU make on PATH.
      - name: generate bundled assets
        run: go run ./tools/genassets
      - name: build
        shell: bash
        run: |
          go build -ldflags "${{ matrix.ldflags }} -X main.version=${GITHUB_REF_NAME}" \
            -o "${{ matrix.asset }}" ./cmd/system-monitor
      # Linux ships three artifacts from the one binary: the bare binary (manual /
      # server use; self-updates when its install dir is writable), an AppImage
      # (self-update target — a single file that swaps like a binary), and a .deb
      # (apt-managed, install-only). Naming must match update.assetName(): the
      # AppImage is system-monitor-linux-amd64.AppImage, the bare binary is the
      # extensionless matrix asset name.
      - name: package linux (.deb + AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version_nov="${GITHUB_REF_NAME#v}" # Debian versions can't start with "v"

          # Brand diamond → PNG for the desktop entry / AppImage / .deb icon.
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 256 -h 256 internal/ui/icons/diamond.svg -o system-monitor.png

          # .deb via nfpm. GOTOOLCHAIN=auto for just this install: nfpm@latest may
          # need a newer Go than our pinned 1.26.3, and setup-go pins GOTOOLCHAIN=local
          # (which would error instead of fetching it). The app binary was already
          # built in the previous step on 1.26.3, so this doesn't touch our build.
          GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          VERSION="$version_nov" "$(go env GOPATH)/bin/nfpm" package \
            --config packaging/nfpm.yaml --packager deb --target .

          # AppImage via linuxdeploy (bundles the GL/X11 libs the binary links).
          mkdir -p AppDir/usr/bin
          cp "${{ matrix.asset }}" AppDir/usr/bin/system-monitor
          curl -sSfL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSfL -o linuxdeploy-plugin-appimage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export PATH="$PWD:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1 # CI runners have no FUSE
          export OUTPUT="system-monitor-linux-amd64.AppImage"
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/system-monitor \
            --desktop-file packaging/system-monitor.desktop \
            --icon-file system-monitor.png \
            --output appimage
      # macOS ships two artifacts from the one binary: the bare binary (the
      # self-update target — update.assetName() resolves it, ADR-011 pattern)
      # and a drag-to-Applications .dmg (install-only). Unsigned: first launch
      # needs right-click → Open until we adopt codesign + notarization.
      - name: package macos (.dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version_nov="${GITHUB_REF_NAME#v}"

          # Brand diamond → .icns via rsvg-convert + the built-in iconutil.
          # Only the 16/32/128/256/512 (+@2x) names are valid iconset members.
          brew install librsvg
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            rsvg-convert -w "$size" -h "$size" internal/ui/icons/diamond.svg \
              -o "icon.iconset/icon_${size}x${size}.png"
            rsvg-convert -w "$((size * 2))" -h "$((size * 2))" internal/ui/icons/diamond.svg \
              -o "icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns icon.iconset -o system-monitor.icns

          # Hand-rolled .app bundle — it's just a directory layout + Info.plist,
          # so no packaging tool is needed.
          app="System Monitor.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "${{ matrix.asset }}" "$app/Contents/MacOS/system-monitor"
          chmod +x "$app/Contents/MacOS/system-monitor"
          cp system-monitor.icns "$app/Contents/Resources/"
          sed "s/__VERSION__/${version_nov}/g" packaging/Info.plist > "$app/Contents/Info.plist"

          # Standard drag-install window: the .app beside an /Applications symlink.
          mkdir dmg-staging
          cp -R "$app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "System Monitor" -srcfolder dmg-staging \
            -format UDZO "${{ matrix.asset }}.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: |
            system-monitor-*
            *.deb

  # The headless recording agent (cmd/system-monitor-record) has no Fyne and no
  # cgo, so unlike the GUI it cross-compiles from one runner. Asset names keep
  # the system-monitor- prefix so the checksum/release globs below cover them;
  # update.assetName() matches exactly, so they can't be mistaken for the GUI
  # self-update asset.
  build-record:
    name: build record agent
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build all platforms
        shell: bash
        run: |
          set -euo pipefail
          build() { GOOS="$1" GOARCH="$2" go build -o "system-monitor-record-$1-$2$3" ./cmd/system-monitor-record; }
          build linux amd64 ""
          build linux arm64 ""
          build windows amd64 ".exe"
          build darwin arm64 ""
      - uses: actions/upload-artifact@v5
        with:
          name: system-monitor-record
          path: system-monitor-record-*

  release:
    name: publish release
    needs: [build, build-record]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true # flatten all per-OS artifacts into dist/
      # Checksums computed once here, over every asset, so the build jobs don't
      # each need a cross-platform sha256 tool (macOS lacks sha256sum).
      # Glob covers both hyphen-named assets (binaries, AppImage) and the
      # underscore-named .deb (system-monitor_<ver>_amd64.deb).
      - name: checksums
        run: |
          cd dist
          sha256sum system-monitor* > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/system-monitor*
            dist/checksums.txt

  # Serve the Linux .deb through a signed static APT repo on the gh-pages
  # branch (issue #66): Debian/Ubuntu users add the repo once and `apt upgrade`
  # keeps system-monitor current. Requires APT_GPG_KEY (armored private key)
  # and APT_GPG_PASSPHRASE repo secrets; the public half is exported to
  # public.key for the keyring setup in docs/install/INSTALL-LINUX.md.
  # One-time setup, outside this workflow: enable GitHub Pages to deploy from
  # the gh-pages branch so https://josephheinz.github.io/system-monitor/ resolves.
  apt-repo:
    name: publish apt repo
    needs: [release]
    runs-on: ubuntu-latest
    env:
      PAGES_BRANCH: gh-pages
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: system-monitor-linux-amd64 # the .deb rides in with the linux build
          path: debs
      - name: install apt repo tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: locate built .deb
        shell: bash
        run: |
          set -euo pipefail
          apt_deb=$(find debs -name 'system-monitor_*.deb' -print -quit)
          if [ -z "$apt_deb" ]; then
            echo "::error::no system-monitor_*.deb found in the linux build artifacts" >&2
            exit 1
          fi
          echo "apt_deb=$apt_deb" >> "$GITHUB_ENV"
      - name: write signing key
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APT_GPG_KEY" ]; then
            echo "::error::APT_GPG_KEY secret is not configured. Add APT_GPG_KEY (armored GPG private key) and APT_GPG_PASSPHRASE to the repository secrets." >&2
            exit 1
          fi
          printf '%s\n' "$APT_GPG_KEY" > key.asc
          chmod 600 key.asc
      - name: clone gh-pages (bootstrap if missing)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pages_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --heads "$pages_url" "refs/heads/$PAGES_BRANCH" | grep -q .; then
            git clone --depth 1 --branch "$PAGES_BRANCH" "$pages_url" apt-repo
          else
            git init -b "$PAGES_BRANCH" apt-repo # first release: create the branch
          fi
      - name: regenerate and sign the repo
        env:
          APT_REPO_DIR: ${{ github.workspace }}/apt-repo
          APT_DEB: ${{ env.apt_deb }}
          APT_GPG_KEY: ${{ github.workspace }}/key.asc
        run: sh scripts/update-apt-repo.sh
      - name: commit and push gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no apt repo changes to push"
          else
            git commit -m "apt repo: publish ${GITHUB_REF_NAME}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PAGES_BRANCH"
          fi
  # Homebrew tap sync (issue #67). Once the release is live this makes macOS
  # users able to `brew tap josephheinz/tap && brew install --cask
  # system-monitor`. The cask is a template — packaging/homebrew/Casks/
  # system-monitor.rb in this repo — with __VERSION__/__SHA256__ placeholders:
  # this job downloads the published .dmg, computes its sha256, copies the cask
  # into josephheinz/homebrew-tap, stamps the live values, and pushes.
  # The tap is a separate repo, so the workflow's GITHUB_TOKEN can't write to
  # it: it needs TAP_REPO_PAT, a fine-grained PAT with Contents: read/write on
  # josephheinz/homebrew-tap. A missing secret fails the job loudly rather than
  # silently leaving macOS users without a tap update.
  sync-homebrew-tap:
    name: sync homebrew tap cask
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: require tap repo PAT
        env:
          TAP_REPO_PAT: ${{ secrets.TAP_REPO_PAT }}
        shell: bash
        run: |
          if [[ -z "${TAP_REPO_PAT}" ]]; then
            echo "::error::TAP_REPO_PAT is not set — cannot sync josephheinz/homebrew-tap."
            echo "Create a fine-grained PAT (Repository access: josephheinz/homebrew-tap,"
            echo "Contents: read/write) and store it as the TAP_REPO_PAT repo secret."
            exit 1
          fi
      - name: fetch dmg and compute sha256
        shell: bash
        run: |
          set -euo pipefail
          dmg_url="https://github.com/josephheinz/system-monitor/releases/download/${GITHUB_REF_NAME}/system-monitor-darwin-arm64.dmg"
          curl -sSfL -o system-monitor.dmg "${dmg_url}"
          dmg_sha256="$(sha256sum system-monitor.dmg | cut -d ' ' -f 1)"
          echo "system-monitor.dmg sha256: ${dmg_sha256}"
          echo "cask_version=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
          echo "dmg_sha256=${dmg_sha256}" >> "${GITHUB_ENV}"
      - name: sync cask into tap repo
        env:
          TAP_REPO_PAT: ${{ secrets.TAP_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${TAP_REPO_PAT}@github.com/josephheinz/homebrew-tap.git" "${tap_dir}"
          cd "${tap_dir}"
          git config user.name "Joseph Heinz"
          git config user.email "josephheinz28@gmail.com"
          mkdir -p Casks
          cp "${GITHUB_WORKSPACE}/packaging/homebrew/Casks/system-monitor.rb" Casks/system-monitor.rb
          sed -i -e "s/__VERSION__/${cask_version}/g" -e "s/__SHA256__/${dmg_sha256}/g" Casks/system-monitor.rb
          git add Casks/system-monitor.rb
          if git diff --cached --quiet; then
            echo "cask unchanged; nothing to push"
            exit 0
          fi
          git commit -m "chore: bump system-monitor cask to v${cask_version}"
          git push origin HEAD
